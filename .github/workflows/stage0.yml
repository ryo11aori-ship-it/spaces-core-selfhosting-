name: Spaces CI minimal

on:
  push:
  workflow_dispatch:

jobs:
  stage4-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ref_vm
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm

      - name: Generate binary (Route A)
        run: |
          python3 tools/gen_compiler.py > hello_selfhost.bin
          ls -l hello_selfhost.bin
          head -c 16 hello_selfhost.bin | hexdump -C

      - name: Run binary
        run: |
          ./bin/ref_vm hello_selfhost.bin > output.txt || true
          cat output.txt || true