name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage12-diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler
        run: |
          mkdir -p spaces/self
          # 失敗してもログを出すために || で繋ぐ
          python3 tools/gen_spaces_compiler.py --debug > spaces/self/spaces_compiler.spaces 2> bf_debug.log || (cat bf_debug.log && exit 1)
          
          echo "=== BF debug head ==="
          head -n 5 bf_debug.log

      - name: Prepare Spaces Source
        run: |
          # 1. ASCIIソース作成
          echo "+++++++++[>++++++++>+++++++++++>+++++<<<-]>.>++.+++++++..+++.>-.------------.<++++++++.--------.+++.------.--------.>+." > hello.bf
          
          # 2. Spaces変換
          python3 tools/generator.py hello.bf > hello.spaces

          # 【診断1】入力ファイルの中身を確認
          echo "=== DIAGNOSIS: hello.spaces (First 64 bytes) ==="
          ls -l hello.spaces
          od -t x1 hello.spaces | head -n 4
          echo "================================================"

      - name: Compile (Spaces -> ELF)
        run: |
          echo "Compiling hello.spaces..."
          ./bin/ref_vm spaces/self/spaces_compiler.spaces < hello.spaces > hello_spaces.elf
          chmod +x hello_spaces.elf
          
          # 【診断2】出力ファイルの中身を確認（コードが生成されているか？）
          echo "=== DIAGNOSIS: hello_spaces.elf (First 256 bytes) ==="
          ls -l hello_spaces.elf
          od -t x1 hello_spaces.elf | head -n 16
          echo "====================================================="

      - name: Run Generated Binary
        run: |
          echo "Running..."
          ./hello_spaces.elf > output.txt
          cat output.txt
          
          if grep -q "Hello, world!" output.txt; then
            echo "🎉 SUCCESS: Spaces Compiler compiled Spaces Code!"
          else
            echo "❌ Failed."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage12-files
          path: |
            hello.spaces
            hello_spaces.elf
            output.txt
