name: Pure Spaces CI
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  purify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 1. The Big Bang (Auto-generate Seed & Static Tests)
      run: |
        # シードバイナリとテストコードが存在しない場合のみ、最後の一回だけ生成してGitに永続化する
        if [ ! -f seed/compiler.elf ]; then
          mkdir -p seed tests bin spaces/self
          
          # 最後のC言語コンパイル
          sed -i 's/int main(int argc, char \*\*argv) {/int main(int argc, char \*\*argv) { setbuf(stdout, NULL);/' src/ref/vm.c
          gcc src/ref/vm.c -o bin/ref_vm
          ./bin/ref_vm src/compiler.spaces < src/compiler.spaces > seed/compiler.elf
          chmod +x seed/compiler.elf
          
          # 最後のPython生成（テストコードの静的ファイル化）
          python3 tools/bf_to_spaces.py <(echo "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.") > tests/test_A.spaces
          python3 tools/bf_to_spaces.py <(echo "++++++[>+++++++++++<-]>.") > tests/loop_test.spaces
          
          # Gitにコミット（これがCとPythonの「墓標」になります）
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seed/compiler.elf tests/test_A.spaces tests/loop_test.spaces
          git commit -m "chore: The Big Bang (Add seed binary and static tests)"
          git push
        fi

    - name: 2. Pure Self-Hosted Compilation (NO C, NO PYTHON)
      run: |
        echo "--- Bootstrapping from Seed ---"
        chmod +x seed/compiler.elf
        # 🚀 C言語を一切使わず、シードバイナリからコンパイラを生成！
        ./seed/compiler.elf < src/compiler.spaces > compiler.elf
        chmod +x compiler.elf

        echo "--- Running Tests (No Python) ---"
        # 🚀 Pythonを一切使わず、静的ファイルからテストを実行！
        ./compiler.elf < tests/test_A.spaces > test_A.elf
        chmod +x test_A.elf
        ./test_A.elf > output_A.txt
        if ! grep -q "A" output_A.txt; then exit 1; fi

        ./compiler.elf < tests/loop_test.spaces > loop_test.elf
        chmod +x loop_test.elf
        ./loop_test.elf > output_loop.txt
        if ! grep -q "B" output_loop.txt; then exit 1; fi

        echo "--- Verifying Fixed Point ---"
        ./compiler.elf < src/compiler.spaces > compiler2.elf
        chmod +x compiler2.elf
        ./compiler2.elf < src/compiler.spaces > compiler3.elf
        chmod +x compiler3.elf
        HASH2=$(sha256sum compiler2.elf | awk '{print $1}')
        HASH3=$(sha256sum compiler3.elf | awk '{print $1}')
        if [ "$HASH2" = "$HASH3" ]; then echo "🎉 PERFECT MATCH"; else exit 1; fi
