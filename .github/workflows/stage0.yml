name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage13-compiler-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler V1
        run: |
          mkdir -p spaces/self
          python3 tools/gen_compiler_v1.py > spaces/self/compiler_v1.spaces

      - name: Prepare Test Source
        run: |
          echo -n "+++++" > test.bf

      - name: Compile test.bf
        run: |
          # timeoutコマンドで最大10秒に制限
          # もし無限ループなら強制終了される（が、コード修正済なので成功するはず）
          timeout 10s ./bin/ref_vm spaces/self/compiler_v1.spaces < test.bf > test.elf

      - name: Verify Compiled Binary
        run: |
          chmod +x test.elf
          
          echo "Running compiled binary..."
          
          set +e
          ./test.elf
          ACTUAL_CODE=$?
          set -e

          echo "Exit Code: $ACTUAL_CODE"

          if [ "$ACTUAL_CODE" -eq 5 ]; then
            echo "🎉 SUCCESS: The compiler translated '+++++' into functional machine code!"
          else
            echo "❌ FAILED: Exit code mismatch."
            echo "Expected: 5, Got: $ACTUAL_CODE"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-v1-outputs
          path: |
            spaces/self/compiler_v1.spaces
            test.bf
            test.elf
