name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage17-compiler-bf-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler (BF Full - Buffered)
        run: |
          mkdir -p spaces/self
          # ここを修正！ full.py を使います
          python3 tools/gen_compiler_bf_full.py > spaces/self/compiler_full.spaces

      - name: Prepare Test Source (Echo + Increment)
        run: |
          # バッファリングが正しく動くか、まずは ,+. でテスト
          echo -n ",+." > test.bf
          echo -n "A" > input.txt

      - name: Compile test.bf
        run: |
          # コンパイル（バッファリング処理が入るので少し時間がかかるかも）
          timeout 30s ./bin/ref_vm spaces/self/compiler_full.spaces < test.bf > test.elf
          chmod +x test.elf

      - name: Verify Compiled Binary
        run: |
          echo "Running compiled binary..."
          
          # A -> B
          ./test.elf < input.txt > output.txt
          
          cat output.txt
          
          if grep -q "B" output.txt; then
            echo "🎉 SUCCESS: Buffered Compiler works! (I/O OK)"
          else
            echo "❌ FAILED: Output mismatch."
            od -t x1 output.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-full-outputs
          path: |
            spaces/self/compiler_full.spaces
            test.bf
            test.elf
            output.txt
