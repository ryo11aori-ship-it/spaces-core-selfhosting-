name: Spaces CI (Stage 0-2)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # === Stage 0: Reference VM の動作確認 ===
  verify-ref-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Reference VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm

      - name: Verify Generator Tool
        run: |
          python3 tools/generator.py "+" > test.spaces
          ls -l test.spaces
          if [ $(stat -c%s test.spaces) -ne 5 ]; then exit 1; fi

      - name: Integration Test (Hello World)
        run: |
          echo "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++." > hello.bf
          python3 tools/generator.py hello.bf > hello.spaces
          ./bin/ref_vm hello.spaces > output.txt
          grep "Hello World!" output.txt

  # === Stage 1: Encoder の動作確認 ===
  verify-encoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Tools
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          gcc tools/encoder.c -o bin/encoder

      - name: Generate Test Source
        run: |
          python3 tools/generator.py "+" > test.spaces

      - name: Run Encoder & Verify Binary
        run: |
          ./bin/encoder test.spaces > test.bin
          
          echo "Binary Dump:"
          od -t x1 test.bin
          
          # Header(SPA) + Opcode(+) check
          HEADER=$(od -t x1 -N 4 -An test.bin | tr -d ' \n')
          if [ "$HEADER" = "53504103" ]; then
            echo "✅ Encoder Verification Passed!"
          else
            echo "❌ Failed! Expected 53504103 but got $HEADER"
            exit 1
          fi

  # === Stage 2: Linear Self-Interpreter Verification ===
  verify-interp:
    runs-on: ubuntu-latest
    needs: [verify-encoder]
    steps:
      - uses: actions/checkout@v4

      - name: Compile Tools
        run: |
          mkdir -p bin spaces/self
          gcc src/ref/vm.c -o bin/ref_vm
          gcc tools/encoder.c -o bin/encoder

      - name: Generate Self-Interpreter
        run: |
          # 以前作成依頼した gen_linear_interp.py が必要です
          python3 tools/gen_linear_interp.py > spaces/self/linear_interp.spaces

      - name: Create Test Input (Print 'A')
        run: |
          # '+' * 65 + '.'
          python3 tools/generator.py "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > print_a.spaces
          ./bin/encoder print_a.spaces > print_a.bin

      - name: Run Self-Interpreter
        run: |
          # VM( Interpreter( Data ) )
          ./bin/ref_vm spaces/self/linear_interp.spaces < print_a.bin > output.txt
          
          cat output.txt
          RESULT=$(cat output.txt)
          if [ "$RESULT" = "A" ]; then
            echo "✅ Self-Interpreter Passed! Output is 'A'."
          else
            echo "❌ Failed! Expected 'A' but got '$RESULT'"
            exit 1
          fi
