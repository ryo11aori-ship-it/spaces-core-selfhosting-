name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage19-vm-logic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Reference VM (C implementation)
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate VM Source (Spaces)
        run: |
          mkdir -p spaces/self
          python3 tools/gen_vm_bf.py > spaces/self/vm.spaces

      - name: Verify VM Logic (Run directly on ref_vm)
        id: run-vm
        run: |
          echo "Testing vm.spaces logic..."
          # Test Source: Output 'A'
          echo "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > test_A.bf
          
          # 実行 (タイムアウト120秒)
          # タイムアウトしてもアーティファクトアップロードに進むようにする
          timeout 120s ./bin/ref_vm spaces/self/vm.spaces < test_A.bf > output.txt || true
          
          echo "Output content (Partial):"
          cat output.txt
          
          # 判定ロジック
          if grep -q "A" output.txt; then
             echo "🎉 SUCCESS: VM Logic is correct!"
          else
             echo "❌ FAILED: VM Logic mismatch or Timeout."
             # ここで exit 1 すると upload が走らない可能性があるため、
             # 判定結果はログに出しつつ、ステップ自体はエラーにするが
             # 次のステップ(Upload)は if: always() で実行させる
             exit 1
          fi

      - name: Upload Debug Artifacts
        if: always() # 成功・失敗・タイムアウトに関わらず実行
        uses: actions/upload-artifact@v4
        with:
          name: vm-debug-artifacts
          path: |
            spaces/self/vm.spaces
            output.txt
            test_A.bf
