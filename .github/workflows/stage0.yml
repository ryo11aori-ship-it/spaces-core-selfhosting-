name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage20-compiler-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Reference VM (Unbuffered)
        run: |
          mkdir -p bin
          sed -i 's/int main(int argc, char \*\*argv) {/int main(int argc, char \*\*argv) { setbuf(stdout, NULL);/' src/ref/vm.c
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler (Spaces)
        run: |
          mkdir -p spaces/self
          mkdir -p src
          # 1. ピュアなBrainfuckで書かれたコンパイラのソースコードを生成
          python3 tools/gen_bf_compiler.py > src/compiler.bf
          # 2. それをSpaces言語にトランスパイル
          python3 tools/bf_to_spaces.py src/compiler.bf > spaces/self/compiler.spaces

      - name: Compile Linear Code using Spaces Compiler
        run: |
          echo "Compiling test_A.bf using compiler.spaces..."
          echo "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > test_A.bf
          
          # ref_vm (Compiler) < test_A.bf > test_A.elf
          timeout 60s ./bin/ref_vm spaces/self/compiler.spaces < test_A.bf > test_A.elf
          chmod +x test_A.elf
          ls -l test_A.elf

      - name: Run Generated ELF
        run: |
          echo "Running test_A.elf..."
          ./test_A.elf > output.txt
          cat output.txt
          
          if grep -q "A" output.txt; then
             echo "🎉 SUCCESS: Linear Compiler Logic works!"
          else
             echo "❌ FAILED: ELF output mismatch."
             exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-artifacts
          path: |
            spaces/self/compiler.spaces
            test_A.elf
            output.txt
