  # === Stage 9: Linear Native Compiler (Real Compilation) ===
  # Spaces言語で書かれたコンパイラが、ASCII BFソースコードを読み込み、機械語に翻訳する。
  stage9-linear-compiler:
    runs-on: ubuntu-latest
    needs: stage5
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm

      # 1. Generate Linear Compiler (Spaces Source)
      - run: python3 tools/gen_linear_compiler.py > spaces/self/linear_compiler.spaces
      
      # 2. Prepare "Unrolled" Hello World Source (ASCII BF)
      #    FIX: Do NOT run generator.py. Pass raw BF because the compiler currently expects ASCII input.
      - run: |
          echo "++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.+++++++++++++++++++++++++++++.+++++++..+++.+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.+++++++++++++++++++++++++++++++++++++++++++++++++++++++.++++++++++++++++++++++++.+++.-------------------------------------------------------------------.------------------------------------------------------------------------------------.+++++++++++++++++++++++++++++++++++++++++++++++++++++++.++++++++++++++++++++++++." > linear_hello.bf

      # 3. Compile Source -> 'linear.elf'
      #    Input: linear_hello.bf (ASCII)
      #    Compiler: linear_compiler.spaces (Running on ref_vm)
      #    Output: linear.elf (Native Executable)
      - run: ./bin/ref_vm spaces/self/linear_compiler.spaces < linear_hello.bf > linear.elf
      
      # 4. Verify Execution
      - run: |
          chmod +x linear.elf
          # Check size (Should be > 140 bytes now)
          ls -l linear.elf
          
          ./linear.elf > output.txt
          cat output.txt
          
          if grep -q "Hello World!" output.txt; then
            echo "🎉 SUCCESS: Linear Compiler works! True Compilation achieved."
          else
            echo "❌ Failed: Compiled binary did not work."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linear-elf
          path: linear.elf
