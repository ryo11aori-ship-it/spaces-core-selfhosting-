  # === Stage 8: Native ELF Compiler (Hello World) ===
  # Spacesコンパイラが、Hello Worldを実行するLinuxバイナリを生成する。
  stage8-compiler:
    runs-on: ubuntu-latest
    needs: stage5
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm

      # 1. Generate the ELF Compiler (Spaces Source)
      - run: python3 tools/gen_elf_compiler.py > spaces/self/elf_compiler.spaces
      
      # 2. Compile 'Hello World' Source -> 'hello.elf'
      #    (The compiler currently ignores input and emits a fixed binary, verifying ELF generation capability)
      - run: echo "dummy" | ./bin/ref_vm spaces/self/elf_compiler.spaces > hello.elf
      
      # 3. Execute Generated ELF
      - run: |
          chmod +x hello.elf
          ./hello.elf > output.txt
          
          cat output.txt
          if grep -q "Hello World!" output.txt; then
            echo "🎉 SUCCESS: Generated valid Hello World ELF!"
          else
            echo "❌ Failed: Binary did not produce expected output."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-elf
          path: hello.elf
