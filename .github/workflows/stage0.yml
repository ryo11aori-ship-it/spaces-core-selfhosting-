name: Spaces CI (Self-Hosted Compiler Minimal)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage4-selfhost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build reference VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm

      - name: Generate self-hosted binary directly (Route A)
        run: |
          python3 tools/gen_compiler.py > hello_selfhost.bin
          echo "=== selfhost binary info ==="
          ls -l hello_selfhost.bin
          head -c 32 hello_selfhost.bin | hexdump -C

      - name: Execute self-hosted binary
        run: |
          ./bin/ref_vm hello_selfhost.bin > output.txt
          echo "=== program output ==="
          cat output.txt

      - name: Verify output
        run: |
          if grep -q "Hello World!" output.txt; then
            echo "🎉 STAGE 4 COMPLETE: Self-hosted compiler works"
          else
            echo "❌ Output mismatch"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-artifacts
          path: |
            hello_selfhost.bin
            output.txt