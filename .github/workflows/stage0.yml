name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage14-compiler-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler V2 (Unrolled Logic)
        run: |
          mkdir -p spaces/self
          python3 tools/gen_compiler_v2.py > spaces/self/compiler_v2.spaces

      - name: Prepare Test Source
        run: |
          # テスト: ++- (1 + 1 - 1 = 1)
          # これが正しく計算されれば、入力を読んで処理している証明になります。
          echo -n "++-" > test.bf

      - name: Compile test.bf
        run: |
          # 実行。コンパイラは test.bf を読み、計算ロジックを出力します。
          timeout 15s ./bin/ref_vm spaces/self/compiler_v2.spaces < test.bf > test.elf

      - name: Verify Compiled Binary
        run: |
          chmod +x test.elf
          ls -l test.elf
          
          echo "Running compiled binary..."
          
          set +e
          ./test.elf
          ACTUAL_CODE=$?
          set -e

          echo "Exit Code: $ACTUAL_CODE"

          # 判定: ++- なので 1 になるはず
          if [ "$ACTUAL_CODE" -eq 1 ]; then
            echo "🎉 SUCCESS: The compiler processed '++-' correctly!"
          else
            echo "❌ FAILED: Logic check failed."
            echo "Expected: 1, Got: $ACTUAL_CODE"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-v2-outputs
          path: |
            spaces/self/compiler_v2.spaces
            test.bf
            test.elf
