name: Spaces CI (Focus on Compiler)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # === Setup: Build Reference VM ===
  setup-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin
      - run: gcc src/ref/vm.c -o bin/ref_vm
      - uses: actions/upload-artifact@v4
        with:
          name: ref-vm-bin
          path: bin/ref_vm

  # === Stage 7: ELF Native Generation (Verification) ===
  # 以前成功した「Hello World固定出力」のテスト
  stage7-elf:
    runs-on: ubuntu-latest
    needs: setup-vm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ref-vm-bin
          path: bin
      - run: chmod +x bin/ref_vm

      - run: mkdir -p spaces/self
      - run: python3 tools/gen_elf_writer.py > spaces/self/elf_writer.spaces
      - run: echo "" | ./bin/ref_vm spaces/self/elf_writer.spaces > tiny.elf
      
      - run: |
          chmod +x tiny.elf
          ./tiny.elf || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 42 ]; then
            echo "🎉 Stage 7 OK: Exit code 42"
          else
            exit 1
          fi

  # === Stage 9: Linear Native Compiler (Real Compilation) ===
  # 本番：Brainfuckソースを読んで機械語に変換するコンパイラ
  stage9-linear-compiler:
    runs-on: ubuntu-latest
    needs: setup-vm  # Stage 5等はスキップしてOK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ref-vm-bin
          path: bin
      - run: chmod +x bin/ref_vm

      - run: mkdir -p spaces/self

      # 1. Generate Linear Compiler (Spaces Source)
      - run: python3 tools/gen_linear_compiler.py > spaces/self/linear_compiler.spaces
      
      # 2. Prepare Source (ASCII BF) - Direct writing to avoid generator.py dependency
      - run: |
          echo "++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.+++++++++++++++++++++++++++++.+++++++..+++.+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.+++++++++++++++++++++++++++++++++++++++++++++++++++++++.++++++++++++++++++++++++.+++.-------------------------------------------------------------------.------------------------------------------------------------------------------------.+++++++++++++++++++++++++++++++++++++++++++++++++++++++.++++++++++++++++++++++++." > linear_hello.bf

      # 3. Compile Source -> 'linear.elf'
      #    Input: linear_hello.bf
      #    Compiler: linear_compiler.spaces (Running on ref_vm)
      #    Output: linear.elf
      - run: ./bin/ref_vm spaces/self/linear_compiler.spaces < linear_hello.bf > linear.elf
      
      # 4. Verify Execution
      - run: |
          chmod +x linear.elf
          ls -l linear.elf
          
          ./linear.elf > output.txt
          cat output.txt
          
          if grep -q "Hello World!" output.txt; then
            echo "🎉 SUCCESS: Linear Compiler works! True Compilation achieved."
          else
            echo "❌ Failed: Compiled binary did not work."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linear-elf
          path: linear.elf
