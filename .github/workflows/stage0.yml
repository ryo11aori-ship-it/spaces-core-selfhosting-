name: Pure Spaces Ultimate CI
on: [push, workflow_dispatch]
jobs:
  build_and_prove:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 0. The Big Bang Strict Provenance
      run: |
        mkdir -p seed tests bin spaces/self
        sed -i 's/int main(int argc, char \*\*argv) {/int main(int argc, char \*\*argv) { setbuf(stdout, NULL);/' src/ref/vm.c
        gcc src/ref/vm.c -o bin/ref_vm
        ./bin/ref_vm src/compiler.spaces < src/compiler.spaces > seed/fresh_compiler.elf
        chmod +x seed/fresh_compiler.elf
        python3 tools/bf_to_spaces.py <(echo "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.") > tests/test_A.spaces
        python3 tools/bf_to_spaces.py <(echo "++++++[>+++++++++++<-]>.") > tests/loop_test.spaces
        if [ -f seed/compiler.elf ]; then
        FRESH=$(sha256sum seed/fresh_compiler.elf | awk '{print $1}')
        REPO=$(sha256sum seed/compiler.elf | awk '{print $1}')
        if [ "$FRESH" != "$REPO" ]; then
        echo "PROVENANCE ERROR: Repo binary differs from fresh source build!"
        exit 1
        fi
        else
        cp seed/fresh_compiler.elf seed/compiler.elf
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add seed/compiler.elf tests/test_A.spaces tests/loop_test.spaces
        git commit -m "chore: Init exact seed"
        git push
        fi

    - name: 1. Setup Tools
      run: sudo apt-get update && sudo apt-get install -y strace binutils libc-bin

    - name: 2. Bootstrap from Seed & Compile All
      run: |
        chmod +x seed/compiler.elf
        ./seed/compiler.elf < src/compiler.spaces > compiler.elf
        chmod +x compiler.elf
        ./compiler.elf < src/compiler.spaces > compiler2.elf
        chmod +x compiler2.elf
        ./compiler2.elf < src/compiler.spaces > compiler3.elf
        chmod +x compiler3.elf
        ./compiler.elf < tests/test_A.spaces > test_A.elf
        chmod +x test_A.elf
        ./compiler.elf < tests/loop_test.spaces > loop_test.elf
        chmod +x loop_test.elf

    - name: 3. Run Functional Tests
      run: |
        ./test_A.elf > output_A.txt
        if ! grep -q "A" output_A.txt; then exit 1; fi
        ./loop_test.elf > output_loop.txt
        if ! grep -q "B" output_loop.txt; then exit 1; fi
        echo "✅ Functional tests passed."

    - name: 4. Prove C - Provenance and Fixed Point Check
      run: |
        SEED_HASH=$(sha256sum seed/compiler.elf | awk '{print $1}')
        COMPILER1_HASH=$(sha256sum compiler.elf | awk '{print $1}')
        COMPILER2_HASH=$(sha256sum compiler2.elf | awk '{print $1}')
        COMPILER3_HASH=$(sha256sum compiler3.elf | awk '{print $1}')
        
        echo "Seed (C-origin):     $SEED_HASH"
        echo "Compiler (Pure):     $COMPILER1_HASH"
        echo "Compiler2 (Re-pure): $COMPILER2_HASH"
        echo "Compiler3:           $COMPILER3_HASH"
        
        if [ "$SEED_HASH" != "$COMPILER1_HASH" ]; then
          echo "❌ PROVENANCE MISMATCH: Seed does not match generated compiler."
          exit 1
        fi
        if [ "$COMPILER1_HASH" != "$COMPILER2_HASH" ] || [ "$COMPILER2_HASH" != "$COMPILER3_HASH" ]; then
          echo "❌ FIXED POINT MISMATCH: Compiler is not stable."
          exit 1
        fi
        echo "🎉 PERFECT MATCH: Provenance Closed and Fixed Point Stable!"

    - name: 5. Prove A - Internal Semantics (Machine Code & Entry Point)
      run: |
        echo "=== Hexdump of compiler.elf ==="
        hexdump -C compiler.elf | head -n 25
        echo "=== Objdump of compiler.elf (Binary mode) ==="
        objdump -D -b binary -m i386:x86-64 compiler.elf | head -n 60 || true
        echo "=== Disassembly Around Entry Point ==="
        objdump -d compiler.elf | head -n 200 || true

    - name: 6. Prove B - External VM Non-Dependence (Strict strace Assertions)
      run: |
        echo "=== ldd loop_test.elf ==="
        ldd loop_test.elf || echo "✅ EXPECTED: not a dynamic executable (No glibc)"
        
        echo "=== Strict strace 1: No external program execution ==="
        strace -f -e trace=execve ./loop_test.elf > /dev/null 2> execve.log
        cat execve.log
        if grep "execve(" execve.log | grep -v "loop_test.elf" > /dev/null; then
          echo "❌ FAILED: External execution detected"
          exit 1
        else
          echo "✅ PASS: No external execution"
        fi
        
        echo "=== Strict strace 2: No file access ==="
        strace -e trace=file ./loop_test.elf > /dev/null 2> file.log
        cat file.log
        if grep -qE "open|access|stat" file.log; then
          echo "❌ FAILED: File access detected"
          exit 1
        else
          echo "✅ PASS: No file dependency"
        fi
        
        echo "=== Full strace of loop_test.elf ==="
        strace ./loop_test.elf > output_loop.txt 2> strace.log
        cat strace.log

    - name: 7. Prove D - No Trace of External Design (strings)
      run: |
        echo "=== strings compiler.elf ==="
        strings compiler.elf | grep -iE "brainfuck|vm|interpreter|op_map|c" || echo "✅ CLEAN: No external semantic strings found!"

    - name: 8. Upload Artifacts (The Proof)
      uses: actions/upload-artifact@v4
      with:
        name: pure-spaces-binaries
        path: |
          *.elf
          output_*.txt