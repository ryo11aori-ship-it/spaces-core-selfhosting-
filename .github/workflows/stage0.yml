name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage12-diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      # --- Level 0: Static Compiler Check (Previous) ---
      - name: Generate Static Compiler
        run: |
          mkdir -p spaces/self
          python3 tools/gen_spaces_direct.py > spaces/self/spaces_compiler.spaces
          echo "=== BF debug head ==="
          head -n 5 bf_debug.log || true

      - name: Prepare Spaces Source
        run: |
          # 1. ASCIIソース作成
          echo "+++++++++[>++++++++>+++++++++++>+++++<<<-]>.>++.+++++++..+++.>-.------------.<++++++++.--------.+++.------.--------.>+." > hello.bf
          
          # 2. Spaces変換
          python3 tools/generator.py hello.bf > hello.spaces

          # 【診断1】入力ファイルの中身を確認
          echo "=== DIAGNOSIS: hello.spaces (First 64 bytes) ==="
          ls -l hello.spaces
          od -t x1 hello.spaces | head -n 4
          echo "================================================"

      - name: Compile (Static)
        run: |
          echo "Compiling hello.spaces..."
          ./bin/ref_vm spaces/self/spaces_compiler.spaces < hello.spaces > hello_spaces.elf
          chmod +x hello_spaces.elf
          
          # 【診断2】出力ファイルの中身を確認
          echo "=== DIAGNOSIS: hello_spaces.elf (First 256 bytes) ==="
          ls -l hello_spaces.elf
          od -t x1 hello_spaces.elf | head -n 16
          echo "====================================================="

      - name: Run Static Binary
        run: |
          echo "Running..."
          ./hello_spaces.elf > output.txt
          cat output.txt
          if grep -q "Hello, world!" output.txt; then
            echo "🎉 SUCCESS: Static Compiler works!"
          else
            echo "❌ Failed."
            exit 1
          fi

      # --- Level 0.5: Smart Compiler Check (New) ---
      - name: Generate Smart Compiler
        run: |
          # 1. コンパイラ（Spacesコード）を生成
          python3 tools/gen_smart_compiler.py > spaces/self/smart_compiler.spaces

      - name: Compile hello.spaces using Smart Compiler
        run: |
          # 2. Spacesコンパイラを実行（入力として hello.spaces を与える）
          ./bin/ref_vm spaces/self/smart_compiler.spaces < hello.spaces > hello_smart.elf

      - name: Verify Smart Compiler Output
        run: |
          # 3. 生成されたバイナリを実行権限付与
          chmod +x hello_smart.elf

          # 期待値の取得: hello.spaces の先頭1バイトを数値(0-255)として取得
          EXPECTED_CODE=$(od -An -t u1 -N 1 hello.spaces | tr -d ' \n')
          echo "Expected Exit Code (First byte of input): $EXPECTED_CODE"

          # 4. 実行して終了コードを確認
          set +e
          ./hello_smart.elf
          ACTUAL_CODE=$?
          set -e

          echo "Actual Exit Code: $ACTUAL_CODE"

          # 判定
          if [ "$ACTUAL_CODE" -eq "$EXPECTED_CODE" ]; then
            echo "🎉 SUCCESS: Exit code reflects the input file content!"
            echo "Input byte: $EXPECTED_CODE, Output exit code: $ACTUAL_CODE"
          else
            echo "❌ FAILED: Exit code does not match."
            echo "Expected: $EXPECTED_CODE, Got: $ACTUAL_CODE"
            exit 1
          fi

      # 最後にまとめてアーティファクトを保存
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-outputs
          path: |
            hello.spaces
            hello_spaces.elf
            output.txt
            spaces/self/smart_compiler.spaces
            hello_smart.elf
