name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage9-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler Source
        run: |
          mkdir -p spaces/self
          python3 tools/gen_linear_compiler.py > spaces/self/linear_compiler.spaces

      - name: Prepare Hello World Source
        run: |
          echo "++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.+++++++++++++++++++++++++++++.+++++++..+++.+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.+++++++++++++++++++++++++++++++++++++++++++++++++++++++.++++++++++++++++++++++++.+++.-------------------------------------------------------------------.------------------------------------------------------------------------------------.+++++++++++++++++++++++++++++++++++++++++++++++++++++++.++++++++++++++++++++++++." > linear_hello.bf

      - name: Run Compilation and Verify
        run: |
          echo "Starting Compilation..."
          ./bin/ref_vm spaces/self/linear_compiler.spaces < linear_hello.bf > linear.elf
          
          echo "Checking Output Binary..."
          ls -l linear.elf
          chmod +x linear.elf
          
          echo "Running Generated Binary..."
          ./linear.elf > output.txt
          cat output.txt
          
          if grep -q "Hello World!" output.txt; then
            echo "SUCCESS: The compiler works!"
          else
            echo "FAILED: Output mismatch"
            exit 1
          fi
