name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage19-vm-logic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Reference VM (Unbuffered)
        run: |
          mkdir -p bin
          # stdoutのバッファリングを無効化する行をmain関数の先頭に挿入
          sed -i 's/int main(int argc, char \*\*argv) {/int main(int argc, char \*\*argv) { setbuf(stdout, NULL);/' src/ref/vm.c
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate VM Source (Spaces)
        run: |
          mkdir -p spaces/self
          python3 tools/gen_vm_bf.py > spaces/self/vm.spaces

      - name: Verify VM Logic (Run directly on ref_vm)
        id: run-vm
        run: |
          echo "Testing vm.spaces logic..."
          echo "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > test_A.bf
          
          # タイムアウトを少し短縮してもログが出るはず
          timeout 60s ./bin/ref_vm spaces/self/vm.spaces < test_A.bf > output.txt || true
          
          echo "Output content:"
          cat output.txt
          
          if grep -q "A" output.txt; then
             echo "🎉 SUCCESS: VM Logic is correct!"
          else
             echo "❌ FAILED: VM Logic mismatch or Timeout."
             exit 1
          fi

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-debug-artifacts
          path: |
            spaces/self/vm.spaces
            output.txt
            test_A.bf
