name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage16-compiler-bf-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler (BF Basic)
        run: |
          mkdir -p spaces/self
          python3 tools/gen_compiler_bf_basic.py > spaces/self/compiler_basic.spaces

      - name: Prepare Test Source (Echo + Increment)
        run: |
          # ソースコード: 1文字読んで(,), インクリメントして(+), 出力する(.)
          echo -n ",+." > test.bf
          
          # 入力データ: 'A' (ASCII 65)
          echo -n "A" > input.txt

      - name: Compile test.bf
        run: |
          # コンパイル実行
          timeout 15s ./bin/ref_vm spaces/self/compiler_basic.spaces < test.bf > test.elf
          chmod +x test.elf

      - name: Verify Compiled Binary
        run: |
          echo "Running compiled binary..."
          
          # 実行: A を入力 -> B が出るはず
          ./test.elf < input.txt > output.txt
          
          cat output.txt
          
          # 判定
          if grep -q "B" output.txt; then
            echo "🎉 SUCCESS: 'A' became 'B'! The compiler supports I/O and Arithmetic!"
          else
            echo "❌ FAILED: Output mismatch."
            od -t x1 output.txt
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-basic-outputs
          path: |
            spaces/self/compiler_basic.spaces
            test.bf
            test.elf
            output.txt
