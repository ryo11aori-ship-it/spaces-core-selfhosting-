name: Spaces CI (Stage 4 Self-Hosted VM)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage4-vm-selfhost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build reference VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm

      - name: Generate self-hosted compiler (Spaces)
        run: |
          mkdir -p spaces/self
          python3 tools/gen_compiler.py > spaces/self/compiler.spaces
          echo "compiler.spaces size:"
          wc -c spaces/self/compiler.spaces

      - name: Prepare BF input
        run: |
          echo "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++." > hello.bf

      - name: Run self-hosted compiler inside VM
        run: |
          ./bin/ref_vm spaces/self/compiler.spaces < hello.bf > hello_selfhost.bin
          echo "=== selfhost binary ==="
          ls -l hello_selfhost.bin
          head -c 32 hello_selfhost.bin | hexdump -C

      - name: Execute self-hosted binary
        run: |
          ./bin/ref_vm hello_selfhost.bin > output.txt
          echo "=== program output ==="
          cat output.txt

      - name: Verify output
        run: |
          if grep -q "Hello World!" output.txt; then
            echo "🎉 STAGE 4 COMPLETE: True VM self-hosting achieved"
          else
            echo "❌ Stage 4 failed"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-vm-selfhost
          path: |
            spaces/self/compiler.spaces
            hello_selfhost.bin
            output.txt