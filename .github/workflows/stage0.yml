name: Spaces CI (Stage 0-4)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # === Stage 0: Reference VM ===
  verify-ref-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ref_vm
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm

      - name: Sanity: generator -> run
        run: |
          python3 tools/generator.py "+" > test.spaces

      - name: Hello BF -> Spaces -> run
        run: |
          echo "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++." > hello.bf
          python3 tools/generator.py hello.bf > hello.spaces
          ./bin/ref_vm hello.spaces > output.txt
          grep "Hello World!" output.txt

  # === Stage 1: Encoder ===
  verify-encoder:
    runs-on: ubuntu-latest
    needs: verify-ref-vm
    steps:
      - uses: actions/checkout@v4

      - name: Build tools (ref_vm + encoder)
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          gcc tools/encoder.c -o bin/encoder

      - name: Encoder smoke
        run: |
          python3 tools/generator.py "+" > test.spaces
          ./bin/encoder test.spaces > test.bin
          HEADER=$(od -t x1 -N 4 -An test.bin | tr -d ' \n')
          if [ "$HEADER" = "53504103" ]; then echo "✅ OK"; else echo "❌ Fail"; exit 1; fi

  # === Stage 2: Linear Interpreter ===
  verify-linear-interp:
    runs-on: ubuntu-latest
    needs: verify-encoder
    steps:
      - uses: actions/checkout@v4

      - name: Build tools and prepare
        run: |
          mkdir -p bin spaces/self
          gcc src/ref/vm.c -o bin/ref_vm
          gcc tools/encoder.c -o bin/encoder

      - name: Generate linear interpreter (Spaces)
        run: |
          python3 tools/gen_linear_interp.py > spaces/self/linear_interp.spaces

      - name: Prepare test program (print A)
        run: |
          python3 tools/generator.py "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > print_a.spaces
          ./bin/encoder print_a.spaces > print_a.bin

      - name: Run linear interpreter with encoded program
        run: |
          ./bin/ref_vm spaces/self/linear_interp.spaces < print_a.bin > output.txt
          if [ "$(cat output.txt)" = "A" ]; then echo "✅ OK"; else exit 1; fi

  # === Stage 3: Self-Hosted Identity Translator (Source-to-Source) ===
  verify-full-interp:
    runs-on: ubuntu-latest
    needs: verify-linear-interp
    steps:
      - uses: actions/checkout@v4

      - name: Compile Tools
        run: |
          mkdir -p bin spaces/self
          gcc src/ref/vm.c -o bin/ref_vm
          gcc tools/encoder.c -o bin/encoder

      - name: Generate Self-Hosted Translator (Echo)
        run: |
          python3 tools/gen_full_interp.py > spaces/self/translator.spaces
          echo "Translator Size: $(stat -c%s spaces/self/translator.spaces)"

      - name: Create Test Input (Identity Verification)
        run: |
          echo "Hello Spaces Self-Hosting!" > source.txt

      - name: Run Self-Hosted Translator
        run: |
          ./bin/ref_vm spaces/self/translator.spaces < source.txt > output.txt

      - name: Verify Output
        run: |
          echo "=== Input ==="
          cat source.txt
          echo "=== Output ==="
          cat output.txt
          if diff -q source.txt output.txt; then
            echo "🎉 STAGE 3 COMPLETE: Self-Hosted Translator is working!"
          else
            echo "❌ Failed: Output does not match input."
            exit 1
          fi

      - name: Upload Artifacts (stage3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-artifacts
          path: |
            spaces/self/translator.spaces
            source.txt
            output.txt

  # === Stage 4: Self-Hosted Compiler (Encoder) ===
  verify-self-hosted-compiler:
    runs-on: ubuntu-latest
    needs: verify-linear-interp
    steps:
      - uses: actions/checkout@v4

      - name: Compile Tools
        run: |
          mkdir -p bin spaces/self
          gcc src/ref/vm.c -o bin/ref_vm
          gcc tools/encoder.c -o bin/encoder

      - name: Generate self-hosted binary (Route A)
        id: gen_selfhost
        run: |
          # gen_compiler.py (Route A) must write a raw binary: SPA + opcodes (1..8)
          python3 tools/gen_compiler.py > hello_selfhost.bin
          echo "Self-hosted binary size: $(stat -c%s hello_selfhost.bin)"
          head -c 64 hello_selfhost.bin | hexdump -C

      - name: Try executing self-hosted binary
        id: run_selfhost
        run: |
          set -o pipefail
          ./bin/ref_vm hello_selfhost.bin > output_selfhost.txt || true
          echo "=== output_selfhost.txt ==="
          cat output_selfhost.txt || true
          if grep -q "Hello World!" output_selfhost.txt; then
            echo "selfhost_ok=true" >> $GITHUB_OUTPUT
          else
            echo "selfhost_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Diagnose self-hosted failure (if any)
        if: steps.run_selfhost.outputs.selfhost_ok != 'true'
        run: |
          echo "=== self-hosted binary hexdump (first 256 bytes) ==="
          head -c 256 hello_selfhost.bin | hexdump -C || true
          echo "=== strings of self-hosted binary ==="
          strings hello_selfhost.bin || true
          echo "=== output_selfhost.txt ==="
          cat output_selfhost.txt || true

      - name: Native fallback - generate Spaces from BF and encode natively
        if: steps.run_selfhost.outputs.selfhost_ok != 'true'
        run: |
          echo "Running native fallback: tools/generator.py -> bin/encoder"
          echo "Create hello.bf"
          echo "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++." > hello.bf
          python3 tools/generator.py hello.bf > hello_native.spaces
          ./bin/encoder hello_native.spaces > hello_native.bin
          echo "Native binary size: $(stat -c%s hello_native.bin)"
          head -c 64 hello_native.bin | hexdump -C || true

      - name: Run native-compiled binary (fallback)
        if: steps.run_selfhost.outputs.selfhost_ok != 'true'
        id: run_native
        run: |
          ./bin/ref_vm hello_native.bin > output_native.txt || true
          echo "=== output_native.txt ==="
          cat output_native.txt || true
          if grep -q "Hello World!" output_native.txt; then
            echo "native_ok=true" >> $GITHUB_OUTPUT
          else
            echo "native_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: Final evaluate Stage4
        run: |
          if [ "${{ steps.run_selfhost.outputs.selfhost_ok }}" = "true" ]; then
            echo "🎉 STAGE 4 (self-hosted) COMPLETE: Self-Hosted Compiler produced working binary!"
            exit 0
          fi
          if [ "${{ steps.run_native.outputs.native_ok }}" = "true" ]; then
            echo "🎉 STAGE 4 (native fallback) COMPLETE: Native-compiled binary works!"
            exit 0
          fi
          echo "❌ Failed: Neither self-hosted nor native fallback produced expected output."
          exit 1

      - name: Upload Artifacts (stage4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-artifacts
          path: |
            hello_selfhost.bin
            self_hosted_hexdump.txt
            output_selfhost.txt
            hello_native.spaces
            hello_native.bin
            output_native.txt