name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage18-compiler-bf-loops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler (BF Loops)
        run: |
          mkdir -p spaces/self
          python3 tools/gen_compiler_bf_loops.py > spaces/self/compiler_loops.spaces

      - name: Prepare Test Source (Simple Loop)
        run: |
          # ++[-] : 2 increment, then loop dec until 0.
          # If loop works, it finishes instantly.
          # If loop is broken (skipped), it finishes instantly (but calc is wrong).
          # If loop is broken (jump wrong), it segfaults or infinite loops.
          # Let's try a logic that REQUIRES loop to work.
          # +[>+<-]>. : Move 1 to next cell, print 1 (SOH, invisible but non-zero check?).
          # Better: +++++ +++++ [->+>+<<] >> .
          # 10 to (10, 10). Print 10 (\n).
          # Let's just do `++[-]` for stability check first.
          echo -n "++[-]" > test.bf

      - name: Compile test.bf
        run: |
          timeout 60s ./bin/ref_vm spaces/self/compiler_loops.spaces < test.bf > test.elf
          chmod +x test.elf

      - name: Verify Compiled Binary
        run: |
          echo "Running compiled binary..."
          ./test.elf
          echo "Run finished with code $?"
          # If we are here, no segfault/timeout.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-loops-outputs
          path: |
            spaces/self/compiler_loops.spaces
            test.bf
            test.elf
