name: Spaces CI (Stage 0-3)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # === Stage 0: Reference VM ===
  verify-ref-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin && gcc src/ref/vm.c -o bin/ref_vm
      - run: python3 tools/generator.py "+" > test.spaces
      - run: if [ $(stat -c%s test.spaces) -ne 5 ]; then exit 1; fi
      - run: |
          echo "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++." > hello.bf
          python3 tools/generator.py hello.bf > hello.spaces
          ./bin/ref_vm hello.spaces > output.txt
          grep "Hello World!" output.txt

  # === Stage 1: Encoder ===
  verify-encoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin && gcc src/ref/vm.c -o bin/ref_vm && gcc tools/encoder.c -o bin/encoder
      - run: python3 tools/generator.py "+" > test.spaces
      - run: |
          ./bin/encoder test.spaces > test.bin
          HEADER=$(od -t x1 -N 4 -An test.bin | tr -d ' \n')
          if [ "$HEADER" = "53504103" ]; then echo "✅ OK"; else echo "❌ Fail"; exit 1; fi

  # === Stage 2: Linear Interpreter ===
  verify-linear-interp:
    runs-on: ubuntu-latest
    needs: verify-encoder
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm && gcc tools/encoder.c -o bin/encoder
      - run: python3 tools/gen_linear_interp.py > spaces/self/linear_interp.spaces
      - run: |
          python3 tools/generator.py "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > print_a.spaces
          ./bin/encoder print_a.spaces > print_a.bin
      - run: |
          ./bin/ref_vm spaces/self/linear_interp.spaces < print_a.bin > output.txt
          if [ "$(cat output.txt)" = "A" ]; then echo "✅ OK"; else exit 1; fi

  # === Stage 3: Full Self-Interpreter (Turing Complete) ===
  verify-full-interp:
    runs-on: ubuntu-latest
    needs: verify-linear-interp
    steps:
      - uses: actions/checkout@v4

      - name: Compile Tools
        run: |
          mkdir -p bin spaces/self
          gcc src/ref/vm.c -o bin/ref_vm
          gcc tools/encoder.c -o bin/encoder

      - name: Generate Full Interpreter
        run: |
          python3 tools/gen_full_interp.py > spaces/self/full_interp.spaces

      - name: Create Test Input (Loop Skip Logic)
        run: |
          # 証明用コード: (Pointer移動なし版)
          # 初期値 0。
          # [ +++++ ]  <-- 0なのでスキップされるべき。
          # +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++ . <-- 'A'(65)を出力
          
          python3 tools/generator.py "[+++++]+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > loop_test.spaces
          ./bin/encoder loop_test.spaces > loop_test.bin

            - name: Run Full Self-Interpreter (with diagnostics)
        run: |
          set -xuo pipefail

          # show interpreter source length + hexdump few bytes (debug)
          echo "=== full_interp.spaces (first 512 bytes, hexdump) ==="
          head -c 512 spaces/self/full_interp.spaces | hexdump -C || true
          echo "=== loop_test.bin (first 64 bytes) ==="
          head -c 64 loop_test.bin | hexdump -C || true

          # run interpreter and capture both stdout/stderr
          ./bin/ref_vm spaces/self/full_interp.spaces < loop_test.bin |& tee output.txt || true

          echo "=== output.txt (raw) ==="
          cat output.txt || true
          echo "=== output.txt (hex) ==="
          head -c 128 output.txt | hexdump -C || true

          # Basic sanity checks (improve granularity of failure reasons)
          if [ -s output.txt ]; then
            # check literal A
            if grep -q "A" output.txt; then
              echo "🎉 STAGE 3 PASSED: Loop Logic Verified (Robust)!"
            else
              echo "❌ Failed: output present but missing 'A' — likely interpreter decoded program incorrectly."
              exit 1
            fi
          else
            echo "❌ Failed: no output produced — maybe interpreter never executed output, or input consumed incorrectly."
            exit 1
          fi
