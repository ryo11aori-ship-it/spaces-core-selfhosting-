name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage20-compiler-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Reference VM (Unbuffered)
        run: |
          mkdir -p bin
          sed -i 's/int main(int argc, char \*\*argv) {/int main(int argc, char \*\*argv) { setbuf(stdout, NULL);/' src/ref/vm.c
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler (Spaces)
        run: |
          mkdir -p spaces/self
          # 今回作成した gen_compiler_bf.py を使用
          python3 tools/gen_compiler_bf.py > spaces/self/compiler.spaces

      - name: Compile VM using Spaces Compiler
        run: |
          echo "Compiling vm.spaces using compiler.spaces..."
          # ref_vm runs compiler.spaces, which reads vm.spaces (ignored for now) and outputs vm.elf
          # timeout 60s
          timeout 60s ./bin/ref_vm spaces/self/compiler.spaces < spaces/self/vm.spaces > vm.elf
          chmod +x vm.elf
          ls -l vm.elf

      - name: Run Generated ELF
        run: |
          echo "Running vm.elf..."
          # The current dummy compiler generates an ELF that just prints 'A'
          ./vm.elf > output.txt
          cat output.txt
          
          if grep -q "A" output.txt; then
             echo "🎉 SUCCESS: ELF generation pipeline works!"
          else
             echo "❌ FAILED: ELF output mismatch."
             exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-artifacts
          path: |
            spaces/self/compiler.spaces
            vm.elf
            output.txt
