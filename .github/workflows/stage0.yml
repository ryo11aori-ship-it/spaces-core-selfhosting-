name: Spaces CI (Stage 0-7)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Stage 0 ~ 6 は変更なし（そのまま残してください）
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin && gcc src/ref/vm.c -o bin/ref_vm
      - run: |
          echo "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++." > hello.bf
          python3 tools/generator.py hello.bf > hello.spaces
          ./bin/ref_vm hello.spaces > output.txt
          grep "Hello World!" output.txt

  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin && gcc src/ref/vm.c -o bin/ref_vm && gcc tools/encoder.c -o bin/encoder
      - run: python3 tools/generator.py "+" > test.spaces
      - run: |
          ./bin/encoder test.spaces > test.bin
          HEADER=$(od -t x1 -N 4 -An test.bin | tr -d ' \n')
          if [ "$HEADER" = "53504103" ]; then echo "✅ OK"; else echo "❌ Fail"; exit 1; fi

  stage2:
    runs-on: ubuntu-latest
    needs: stage1
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm && gcc tools/encoder.c -o bin/encoder
      - run: python3 tools/gen_linear_interp.py > spaces/self/linear_interp.spaces
      - run: |
          python3 tools/generator.py "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > print_a.spaces
          ./bin/encoder print_a.spaces > print_a.bin
      - run: |
          ./bin/ref_vm spaces/self/linear_interp.spaces < print_a.bin > output.txt
          if [ "$(cat output.txt)" = "A" ]; then echo "✅ OK"; else exit 1; fi

  stage3:
    runs-on: ubuntu-latest
    needs: stage2
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm
      - run: python3 tools/gen_full_interp.py > spaces/self/translator.spaces
      - run: |
          echo "Hello Spaces Self-Hosting!" > source.txt
          ./bin/ref_vm spaces/self/translator.spaces < source.txt > output.txt
          diff -q source.txt output.txt

  stage4:
    runs-on: ubuntu-latest
    needs: stage2
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm
      - run: python3 tools/gen_compiler.py > spaces/self/compiler.spaces
      - run: |
          echo "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++." > hello.bf
          ./bin/ref_vm spaces/self/compiler.spaces < hello.bf > hello.bin
          ./bin/ref_vm hello.bin > output.txt
          if grep -q "Hello World!" output.txt; then echo "✅ Stage 4 Passed"; else exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4-artifacts
          path: |
            spaces/self/compiler.spaces
            hello.bin

  stage5:
    runs-on: ubuntu-latest
    needs: stage4
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm
      - run: python3 tools/gen_native_compiler.py > spaces/self/native_compiler.spaces
      - run: |
          echo "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++." > hello.bf
          python3 tools/generator.py hello.bf > hello.spaces
          ./bin/ref_vm spaces/self/native_compiler.spaces < hello.spaces > hello_native.bin
      - run: |
          SIZE=$(stat -c%s hello_native.bin)
          if [ "$SIZE" -le 4 ]; then echo "❌ Binary too small"; exit 1; fi
          ./bin/ref_vm hello_native.bin > output.txt
          if grep -q "Hello World!" output.txt; then echo "✅ Stage 5 Passed"; else exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-artifacts
          path: |
            spaces/self/native_compiler.spaces
            hello_native.bin
            output.txt

  stage6:
    runs-on: ubuntu-latest
    needs: [stage1, stage5]
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm && gcc tools/encoder.c -o bin/encoder
      - run: python3 tools/gen_native_compiler.py > spaces/self/native_compiler.spaces
      - run: |
          echo "++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++." > hello.bf
          python3 tools/generator.py hello.bf > hello.spaces
          ./bin/encoder hello.spaces > binary_A.bin
          ./bin/ref_vm spaces/self/native_compiler.spaces < hello.spaces > binary_B.bin
      - run: |
          md5sum binary_A.bin binary_B.bin
          diff -q binary_A.bin binary_B.bin

  # === Stage 7: ELF Native Generation (Linux) ===
  # Spaces プログラムを実行し、Linux ELF バイナリを生成・実行する。
  # これが成功すれば、Spaces は OS ネイティブで動作する言語となる。
  stage7-elf:
    runs-on: ubuntu-latest
    needs: stage5
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm

      # 1. Generate ELF Writer Source (Spaces Code)
      - run: python3 tools/gen_elf_writer.py > spaces/self/elf_writer.spaces
      
      # 2. Run ELF Writer on VM -> Output 'tiny.elf'
      #    Input is dummy, Output is binary.
      - run: echo "" | ./bin/ref_vm spaces/self/elf_writer.spaces > tiny.elf
      
      # 3. Execute Generated ELF
      - run: |
          chmod +x tiny.elf
          ./tiny.elf || EXIT_CODE=$?
          
          echo "Exit Code: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 42 ]; then
            echo "🎉 SUCCESS: Generated valid Linux ELF executable!"
          else
            echo "❌ Failed: Incorrect exit code."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-elf
          path: tiny.elf
    # === Stage 8: Windows Cross-Compilation (Linux -> Windows EXE) ===
  # Spaces プログラムを実行し、Windows用 .exe ファイルを生成する。
  # 生成されたファイルが正しい PE フォーマットか検証する。
  stage8-cross-compile:
    runs-on: ubuntu-latest
    needs: stage7-elf
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p bin spaces/self
      - run: gcc src/ref/vm.c -o bin/ref_vm

      # 1. Generate PE Writer Source (Spaces Code)
      - run: python3 tools/gen_pe_writer.py > spaces/self/pe_writer.spaces
      
      # 2. Run PE Writer on VM -> Output 'minimal.exe'
      - run: echo "" | ./bin/ref_vm spaces/self/pe_writer.spaces > minimal.exe
      
      # 3. Verify File Format (Cross-Check on Linux)
      - run: |
          file minimal.exe
          # "PE32+" という文字列が含まれていれば、正常なWindows実行ファイル
          if file minimal.exe | grep -q "PE32+"; then
            echo "🎉 SUCCESS: Generated valid Windows PE32+ executable!"
          else
            echo "❌ Failed: Output is not recognized as PE format."
            exit 1
          fi

      # 4. Upload .exe for you to download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-exe
          path: minimal.exe

