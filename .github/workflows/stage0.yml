name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage19-vm-in-spaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM (Reference)
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler (Stage 18)
        run: |
          mkdir -p spaces/self
          python3 tools/gen_compiler_bf_loops.py > spaces/self/compiler_loops.spaces

      - name: Generate VM Source (Stage 19)
        run: |
          # Generates vm.spaces (BF source of the VM)
          python3 tools/gen_vm_bf.py > spaces/self/vm.spaces

      - name: Compile VM using Spaces Compiler
        run: |
          # Use the self-hosted compiler to build the VM
          timeout 60s ./bin/ref_vm spaces/self/compiler_loops.spaces < spaces/self/vm.spaces > vm.elf
          chmod +x vm.elf

      - name: Verify VM
        run: |
          echo "Running VM test..."
          # Test: Output 'A'
          echo "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > test_A.bf
          
          # Run: test_A.bf | vm.elf
          # The VM reads BF code from stdin and executes it.
          ./vm.elf < test_A.bf > output.txt
          
          cat output.txt
          if grep -q "A" output.txt; then
             echo "🎉 SUCCESS: VM in Spaces works!"
          else
             echo "❌ FAILED: VM Output mismatch."
             exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage19-outputs
          path: |
            spaces/self/vm.spaces
            vm.elf
