name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage19-self-hosting-linear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      # 1. 前回のコンパイラ(Spaces版)を復元
      # ここでは再生成しますが、あなたの修正済みコードが必要です。
      # gen_compiler_bf_loops.py はリポジトリにある前提で動きます。
      - name: Regenerate Compiler (Loop Version)
        run: |
          mkdir -p spaces/self
          python3 tools/gen_compiler_bf_loops.py > spaces/self/compiler_loops.spaces

      # 2. 今回の主役: BFで書かれたコンパイラソースを生成
      - name: Generate Compiler Source (Brainfuck)
        run: |
          python3 tools/gen_bf_source.py > spaces/self/compiler_linear.bf

      # 3. セルフホスティング: Spacesコンパイラで BFソースをコンパイル！
      # これが成功すれば「コンパイラがコンパイラをコンパイルした」ことになる
      - name: Compile BF Compiler using Spaces Compiler
        run: |
          echo "Compiling compiler_linear.bf ..."
          timeout 60s ./bin/ref_vm spaces/self/compiler_loops.spaces < spaces/self/compiler_linear.bf > compiler_linear.elf
          chmod +x compiler_linear.elf
          ls -l compiler_linear.elf

      # 4. 生まれたコンパイラでテストコードをコンパイル
      - name: Test Self-Hosted Compiler
        run: |
          # ループなしのテスト (Linear compilerなので)
          echo -n ",+." > test_linear.bf
          echo -n "A" > input.txt
          
          echo "Compiling test_linear.bf using compiler_linear.elf ..."
          ./compiler_linear.elf < test_linear.bf > test_linear.elf
          chmod +x test_linear.elf
          
          echo "Running test..."
          ./test_linear.elf < input.txt > output.txt
          cat output.txt
          
          if grep -q "B" output.txt; then
             echo "🎉 SUCCESS: Self-Hosting Cycle Complete (Linear)!"
          else
             echo "❌ FAILED: Output mismatch."
             exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-hosting-artifacts
          path: |
            spaces/self/compiler_loops.spaces
            spaces/self/compiler_linear.bf
            compiler_linear.elf
            test_linear.elf
