name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage19-vm-logic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Reference VM (C implementation)
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate VM Source (Spaces)
        run: |
          mkdir -p spaces/self
          # インデント修正版の gen_vm_bf.py を使用
          python3 tools/gen_vm_bf.py > spaces/self/vm.spaces

      - name: Verify VM Logic (Run directly on ref_vm)
        run: |
          echo "Testing vm.spaces logic..."
          # Test Source: Output 'A'
          echo "+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++." > test_A.bf
          
          # 【重要】
          # ここではコンパイルを行わず、C製VM (ref_vm) の上で
          # Spaces製VM (vm.spaces) を動かし、その上で test_A.bf を解釈させます。
          # これはいわゆる「インタプリタのインタプリタ」状態です。
          # 構造: ref_vm(C) -> vm.spaces(BF) -> test_A.bf
          
          # ※実行速度が遅くなるためタイムアウトを延長します
          timeout 120s ./bin/ref_vm spaces/self/vm.spaces < test_A.bf > output.txt
          
          echo "Output content:"
          cat output.txt
          
          if grep -q "A" output.txt; then
             echo "🎉 SUCCESS: VM Logic is correct!"
          else
             echo "❌ FAILED: VM Logic mismatch."
             exit 1
          fi
