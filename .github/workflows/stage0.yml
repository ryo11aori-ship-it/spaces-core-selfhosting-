name: Pure Spaces CI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: 1. Bootstrap from Seed
      run: |
        chmod +x seed/compiler.elf
        ./seed/compiler.elf < src/compiler.spaces > compiler.elf
        chmod +x compiler.elf

    - name: 2. The Provenance Proof (Closing the Loop)
      run: |
        echo "Hashing the initial seed (Git tracking)..."
        SEED_HASH=$(sha256sum seed/compiler.elf | awk '{print $1}')
        echo "Hashing the compiler built by the seed..."
        COMPILER_HASH=$(sha256sum compiler.elf | awk '{print $1}')
        
        echo "Seed:     $SEED_HASH"
        echo "Compiler: $COMPILER_HASH"
        
        if [ "$SEED_HASH" = "$COMPILER_HASH" ]; then
          echo "🎉 PROVENANCE CLOSED: The seed is mathematically identical to the compiler.spaces output!"
        else
          echo "❌ MISMATCH: The seed contains external taint."
          exit 1
        fi

    - name: 3. Verify Perfect Fixed Point
      run: |
        ./compiler.elf < src/compiler.spaces > compiler2.elf
        chmod +x compiler2.elf
        COMPILER2_HASH=$(sha256sum compiler2.elf | awk '{print $1}')
        if [ "$COMPILER_HASH" = "$COMPILER2_HASH" ]; then
          echo "🎉 PERFECT MATCH: T=1 and T=2 are strictly identical."
        else
          exit 1
        fi

    - name: 4. Run Tests (Static Files)
      run: |
        ./compiler.elf < tests/test_A.spaces > test_A.elf
        chmod +x test_A.elf
        ./test_A.elf > output_A.txt
        if ! grep -q "A" output_A.txt; then exit 1; fi
        ./compiler.elf < tests/loop_test.spaces > loop_test.elf
        chmod +x loop_test.elf
        ./loop_test.elf > output_loop.txt
        if ! grep -q "B" output_loop.txt; then exit 1; fi
