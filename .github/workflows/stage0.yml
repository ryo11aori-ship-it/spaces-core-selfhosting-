name: Stage 9 Debug CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ジョブを分けずに一気通貫で実行することで、ログ消失を防ぐ
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. デバッグ: ファイルが本当に存在するか確認
      - name: Debug File Existence
        run: |
          echo "=== Current Directory Content ==="
          ls -R
          
          echo "=== Checking Critical Files ==="
          if [ ! -f src/ref/vm.c ]; then
            echo "❌ ERROR: src/ref/vm.c is missing!"
            exit 1
          fi
          if [ ! -f tools/gen_linear_compiler.py ]; then
            echo "❌ ERROR: tools/gen_linear_compiler.py is missing!"
            echo "Did you commit the python script?"
            exit 1
          fi
          echo "✅ Critical files found."

      # 2. VMのビルド (C言語)
      - name: Build Reference VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm
          echo "✅ VM Built successfully."

      # 3. コンパイラの生成 (Spaces言語)
      - name: Generate Linear Compiler
        run: |
          mkdir -p spaces/self
          python3 tools/gen_linear_compiler.py > spaces/self/linear_compiler.spaces
          echo "✅ Compiler Source Generated."

      # 4. テスト用ソースコードの準備 (ASCII Brainfuck)
      - name: Prepare Hello World Source
        run: |
          echo "++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.+++++++++++++++++++++++++++++.+++++++..+++.+++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++.+++++++++++++++++++++++++++++++++++++++++++++++++++++++.++++++++++++++++++++++++.+++.-------------------------------------------------------------------.------------------------------------------------------------------------------------.+++++++++++++++++++++++++++++++++++++++++++++++++++++++.++++++++++++++++++++++++." > linear_hello.bf

      # 5. コンパイル実行 (Spaces VM上で Spaces コンパイラを動かす)
      - name: Run Compilation (Stage 9)
        run: |
          echo "Running Compiler..."
          # 入力: BFソース -> 処理: Spacesコンパイラ -> 出力: ELFバイナリ
          ./bin/ref_vm spaces/self/linear_compiler.spaces < linear_hello.bf > linear.elf
          
          ls -l linear.elf
          echo "✅ Compilation finished."

      # 6. 生成されたELFの動作確認
      - name: Verify Execution
        run: |
          chmod +x linear.elf
          ./linear.elf > output.txt
          
          echo "--- Program Output ---"
          cat output.txt
          echo "----------------------"
          
          if grep -q "Hello World!" output.txt; then
            echo "🎉 SUCCESS: The Spaces Compiler works!"
          else
            echo "❌ FAILED: Output mismatch."
            exit 1
          fi
