name: Spaces Compiler CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  stage15-compiler-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VM
        run: |
          mkdir -p bin
          gcc src/ref/vm.c -o bin/ref_vm
          chmod +x bin/ref_vm

      - name: Generate Compiler (Loop Version)
        run: |
          mkdir -p spaces/self
          # 今回は新しい loop.py を使います
          python3 tools/gen_compiler_loop.py > spaces/self/compiler_loop.spaces

      - name: Prepare Test Source
        run: |
          # テスト: + を10回。
          # ループが正しく回れば、Exit Code 10 になるはずです。
          echo -n "++++++++++" > test.bf

      - name: Compile test.bf
        run: |
          # 実行。コンパイラは test.bf を読み、計算ロジックを出力します。
          # 念のため timeout を入れておきます（無限ループ対策）
          timeout 15s ./bin/ref_vm spaces/self/compiler_loop.spaces < test.bf > test.elf

      - name: Verify Compiled Binary
        run: |
          chmod +x test.elf
          ls -l test.elf
          
          echo "Running compiled binary..."
          
          set +e
          ./test.elf
          ACTUAL_CODE=$?
          set -e

          echo "Exit Code: $ACTUAL_CODE"

          # 判定: + が10個なので 10
          if [ "$ACTUAL_CODE" -eq 10 ]; then
            echo "🎉 SUCCESS: The LOOP compiler works correctly!"
          else
            echo "❌ FAILED: Loop logic check failed."
            echo "Expected: 10, Got: $ACTUAL_CODE"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-loop-outputs
          path: |
            spaces/self/compiler_loop.spaces
            test.bf
            test.elf
